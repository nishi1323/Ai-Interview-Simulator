spring.application.name=ai-interview-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_interview}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai_interview}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

ai.service.url=http://localhost:8001
assistant.groq.api-key=${GROQ_API_KEY:}
assistant.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
